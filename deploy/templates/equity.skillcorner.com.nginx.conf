# ==============================================================================
# Nginx Reverse Proxy Configuration for equity.skillcorner.com
# Target: Equity AI Calling Agent OS (Frontend :3000, FastAPI :8000, WebSockets)
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name equity.skillcorner.com;

    # ACME Challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name equity.skillcorner.com;

    # SSL Certificates (managed via Certbot or Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/equity.skillcorner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/equity.skillcorner.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum payload size for audio uploads / knowledge documents (50MB)
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # 1. Acuity Core FastAPI Backend & Carrier Webhooks (:8000)
    # --------------------------------------------------------------------------
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;

        # WebSockets & Streaming connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Client and Host identity preservation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for streaming voice & telephony sessions
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2. Public Embeddable Audio & Voice Widget (Allow embedding on skillcorner.com)
    # --------------------------------------------------------------------------
    location /embed/ {
        proxy_pass http://127.0.0.1:3000/embed/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow cross-origin script embedding and iframe mounting on Skill Corner
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }

    # --------------------------------------------------------------------------
    # 3. Next.js Web Frontend & Business Proxy Routes (:3000)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSockets (Next.js HMR in dev / live updates in prod)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
