name: Business Extension CI

on:
  pull_request:
    branches: [main]
    paths:
      - "ui/**"
      - "extensions/business-api/**"
      - ".github/workflows/business-extension-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://business_app_user:test_business_pass@localhost:5432/postgres
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      BUSINESS_EXT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: business_app_user
      POSTGRES_PASSWORD: test_business_pass
      POSTGRES_DB: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Test Database Roles and Schema
        run: |
          # 1. Apply authoritative Acuity public schema (31 tables, enums, triggers, constraints)
          docker exec -i $(docker ps -q --filter ancestor=pgvector/pgvector:pg17) psql -U postgres -d postgres < extensions/business-api/scripts/Acuity_public_schema.sql

          # 2. Configure unprivileged runtime user and least privilege grants
          docker exec -i $(docker ps -q --filter ancestor=pgvector/pgvector:pg17) psql -U postgres -d postgres << 'EOF'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'business_app_user') THEN
              CREATE ROLE business_app_user WITH LOGIN PASSWORD 'test_business_pass' NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT;
            END IF;
          END
          $$;

          -- Grant SELECT on all public tables to business_app_user (read-only Acuity access)
          GRANT USAGE ON SCHEMA public TO business_app_user;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO business_app_user;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO business_app_user;
          EOF

      - name: Install Dependencies
        working-directory: extensions/business-api
        run: bun install

      - name: Run Migrations
        working-directory: extensions/business-api
        run: bun run src/config/migrator.ts

      - name: Run Test Suite
        working-directory: extensions/business-api
        run: bun test

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI Dependencies
        working-directory: ui
        run: bun install

      - name: Run UI Test Suite
        working-directory: ui
        run: bun run test
